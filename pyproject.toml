[project]
name = "ticktick-calendar-sync"
version = "2.0.0"
description = "Two-way sync between timed TickTick tasks and an iCloud TickTick Tasks calendar (Phase 2)"
requires-python = ">=3.11"
dependencies = [
    "caldav>=1.3.9",
    "icalendar>=5.0.0",
    "requests>=2.32.0",
    "pytz>=2024.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
sync-ticktick-cal = "ticktick_cal_sync.sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ticktick_cal_sync"]

[tool.uv]
package = true
